[project]
name = "memoria-mcp"
version = "0.1.0"
description = "Memoria persistente y acotada (MCP stdio) para el asistente de entrenamiento"
requires-python = ">=3.12"
dependencies = ["mcp==2.2.0"]

[project.scripts]
memoria-mcp = "memoria_mcp.server:main"
control-mcp = "memoria_mcp.control:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memoria_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
